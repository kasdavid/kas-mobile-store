<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | KAS MOBILE STORE</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="register.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- REGISTRATION PAGE -->
    <main class="register-container">

        <div class="register-card">

            <!-- LOGO -->
            <div class="register-logo">

                <h1>KAS <span>MOBILE</span></h1>

                <p>STORE</p>

            </div>


            <!-- HEADING -->
            <div class="register-heading">

                <h2>Create Your Account</h2>

                <p>Join KAS MOBILE STORE and enjoy shopping.</p>

            </div>


            <!-- REGISTRATION FORM -->
            <form id="registerForm">

                <!-- CUSTOMER NAME -->
                <div class="form-group">

                    <label for="registerName">Full Name</label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="registerName"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="registerEmail">Email Address</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- PHONE NUMBER -->
                <div class="form-group">

                    <label for="registerPhone">Phone Number</label>

                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="registerPhone"
                            name="phone"
                            placeholder="e.g. 097XXXXXXXX"
                            autocomplete="tel"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="registerPassword">Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerPassword"
                            aria-label="Show password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-shield-halved"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show confirm password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- TERMS AND CONDITIONS -->
                <div class="terms-container">

                    <label class="terms-label">

                        <input
                            type="checkbox"
                            id="acceptTerms"
                            required>

                        <span>
                            I agree to the
                            <a href="terms.html">Terms & Conditions</a>
                            and
                            <a href="privacy.html">Privacy Policy</a>.
                        </span>

                    </label>

                </div>


                <!-- CREATE ACCOUNT BUTTON -->
                <button
                    type="submit"
                    id="registerButton">

                    <span>Create Account</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <!-- REGISTRATION MESSAGE -->
                <div id="registerStatus"></div>
<!-- GOOGLE REGISTRATION -->
<div class="google-divider">
    <span>OR</span>
</div>

<button type="button" id="googleRegisterButton" class="google-login-button">

    <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google">

    <span>Continue with Google</span>

</button>
            </form>


            <!-- SIGN IN LINK -->
            <div class="register-login-link">

                <p>
                    Already have an account?

                    <a href="account.html">Sign In</a>
                </p>

            </div>


            <!-- BACK TO STORE -->
            <div class="back-to-store">

                <a href="index.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Store

                </a>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script type="module" src="register.js"></script>

</body>

</html>
